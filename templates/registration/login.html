{% extends "base.html" %} {% block title %}Log in — PlantPal{% endblock %} {% block content %}
<div class="auth-page">
    <h1>Log in</h1>
    <form class="pp-form" method="post" novalidate>
        {% csrf_token %} {{ form.as_p }}
        <button type="submit" class="btn btn-success">Log in</button>
    </form>
    <p class="mt-3">
        No account?
        <a href="{% url 'register' %}">Register</a>
    </p>
</div>
{% endblock %}
