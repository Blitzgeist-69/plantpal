{% extends "base.html" %} {% block title %}Register — PlantPal{% endblock %} {% block content %}
<div class="auth-page">
    <h1>Create your PlantPal account</h1>
    <form class="pp-form" method="post" novalidate>
        {% csrf_token %} {{ form.as_p }}
        <button type="submit" class="btn btn-success">Register</button>
    </form>
    <p class="mt-3">
        Already registered?
        <a href="{% url 'login' %}">Log in</a>
    </p>
</div>
{% endblock %}
